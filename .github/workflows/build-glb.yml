name: Gerar modelos GLB otimizados
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CANIL.ifc'
      - 'ESTRUTURAL.ifc'
      - 'ELETRICO.ifc'
      - 'HIDRAULICA.ifc'
      - 'scripts/build_glb.py'
      - '.github/workflows/build-glb.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar conversor
        run: python -m pip install --no-cache-dir "ifcopenshell==0.8.3" "numpy<2" "trimesh>=4,<5"
      - name: Converter IFC para GLB
        run: python scripts/build_glb.py
      - name: Publicar modelos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          if ! git diff --cached --quiet; then
            git commit -m "build: atualizar modelos GLB otimizados"
            git push
          fi
